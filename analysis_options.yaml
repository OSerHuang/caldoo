include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.x is an analysis_server_plugin (no custom_lint anymore).
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # json_serializable puts @JsonKey on constructor params; the annotation
    # target warning is a false positive in this project's generated models.
    invalid_annotation_target: ignore

linter:
  rules:
    always_declare_return_types: true
    avoid_print: false
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    unawaited_futures: true
    use_super_parameters: true
