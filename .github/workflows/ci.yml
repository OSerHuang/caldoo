# CI gate for every push to master and every PR. The release flow lives in
# .github/workflows/release.yml (tag-driven).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: codegen + format + analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to the local toolchain (stable 3.47.5, revision 6a19cca564 per
      # .metadata). Bump this together with the local flutter upgrade.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # All .g.dart files (drift / riverpod / json_serializable) are committed,
      # so a stale checkout is a real bug — catch it here.
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain -- '*.g.dart')" ]; then
            git status --porcelain -- '*.g.dart'
            echo "::error::Generated .g.dart files are out of date. Run 'dart run build_runner build --delete-conflicting-outputs' locally and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      # The ui-renders goldens are macOS review artifacts, not CI gates (see
      # dart_test.yaml) — exclude them; everything else runs.
      - run: flutter test --exclude-tags=ui-renders
