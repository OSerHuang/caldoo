# Release flow: push a version tag to build the signed release APK and
# publish it to GitHub Releases. The tag must match the version in
# pubspec.yaml (tag v1.2.3 <-> version: 1.2.3+N).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Pinned to the local toolchain (stable 3.47.5, revision 6a19cca564 per
      # .metadata). Bump this together with the local flutter upgrade.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check tag matches pubspec version
        run: |
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pubspec version $PUBSPEC_VERSION. Bump pubspec.yaml first, then tag."
            exit 1
          fi

      # android/key.properties + android/app/caldoo-release.jks are gitignored;
      # on CI they are restored from GitHub Secrets (see README "CI/CD").
      - name: Restore release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/caldoo-release.jks
          cat > android/key.properties <<EOF
          storeFile=caldoo-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release

      # Fail loudly if the gradle signing config silently fell back to the
      # debug key (e.g. key.properties malformed).
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "caldoo-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: caldoo-${{ github.ref_name }}
          path: caldoo-*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: caldoo-*.apk
          generate_release_notes: true
